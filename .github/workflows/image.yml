name: Image

# Builds ghcr.io/mlab-sh/k3sec again from a published release's binary, without
# rebuilding anything: for a Dockerfile fix, or a new mlab-agent on apt.mlab.sh.
# The release workflow builds the image of a new version itself.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version (without the v), e.g. 1.5.0
        required: true
      latest:
        description: Also tag it latest
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      # The Dockerfile from main (its fixes), the binary from the release.
      - name: Dockerfile from main
        run: git fetch --depth 1 origin main && git checkout origin/main -- deploy/Dockerfile deploy/entrypoint.sh

      - name: Release binary
        run: |
          gh release download "v$VERSION" -p "k3sec-$VERSION-x86_64-unknown-linux-gnu.tar.gz" -D rel
          tar -xzf rel/*.tar.gz -C rel
          mkdir -p dist
          cp "rel/k3sec-$VERSION-x86_64-unknown-linux-gnu/k3sec" dist/k3sec-linux-amd64

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: K3SEC_FROM=dist
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mlab-sh/k3sec:${{ inputs.version }}
            ${{ inputs.latest && 'ghcr.io/mlab-sh/k3sec:latest' || '' }}

      - name: Check the image
        run: |
          docker run --rm --entrypoint sh "ghcr.io/mlab-sh/k3sec:$VERSION" -c 'k3sec --version && mlab-agent --version'
