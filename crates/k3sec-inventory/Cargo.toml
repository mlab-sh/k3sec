[package]
name = "k3sec-inventory"
description = "k3sec runtime-aware vulnerability inventory: container packages, SBOMs, loaded/dormant tagging, vuln.mlab.sh matching"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
k3sec-core.workspace = true

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
owo-colors.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# rpmdb.sqlite reader; bundles SQLite (C build), hence opt-in.
rusqlite = { version = "0.37", features = ["bundled"], optional = true }

[features]
# Inventory RPM-based images (Rocky, Alma, RHEL/UBI) via rpmdb.sqlite.
rpm = ["dep:rusqlite"]

[dev-dependencies]
tempfile = "3"
