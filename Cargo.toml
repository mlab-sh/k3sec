[workspace]
resolver = "2"
members = [
    "crates/k3sec",
    "crates/k3sec-agent",
    "crates/k3sec-api",
    "crates/k3sec-core",
    "crates/k3sec-engine",
    "crates/k3sec-inventory",
    "crates/k3sec-k8s",
    "crates/k3sec-probe",
    "crates/k3sec-probe-common",
    "crates/k3sec-probe-ebpf",
]
# k3sec-probe-ebpf must be a member so aya-build's `cargo build --package
# k3sec-probe-ebpf` can find it, but it only ever builds for the BPF target
# (via k3sec-probe's build script). Keeping it out of `default-members` means a
# normal host `cargo build`/`clippy`/`test` never tries to compile it.
default-members = [
    "crates/k3sec",
    "crates/k3sec-agent",
    "crates/k3sec-api",
    "crates/k3sec-core",
    "crates/k3sec-engine",
    "crates/k3sec-inventory",
    "crates/k3sec-k8s",
    "crates/k3sec-probe",
    "crates/k3sec-probe-common",
]

[workspace.package]
version = "1.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mlab-sh/k3sec"
rust-version = "1.85"

[workspace.dependencies]
k3sec-agent = { path = "crates/k3sec-agent" }
k3sec-api = { path = "crates/k3sec-api" }
k3sec-core = { path = "crates/k3sec-core" }
k3sec-engine = { path = "crates/k3sec-engine" }
k3sec-inventory = { path = "crates/k3sec-inventory" }
k3sec-k8s = { path = "crates/k3sec-k8s" }
k3sec-probe = { path = "crates/k3sec-probe" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "rustls-tls", "ring"] }
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
